<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeachKit AI — Worksheet Generator for Indian Teachers</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>body{font-family:Georgia,serif;background:#F7F6F3;color:#1a1a1a;margin:0}.app{max-width:780px;margin:0 auto;padding:0 16px 60px}.site-header{display:flex;justify-content:space-between;align-items:center;padding:20px 0 18px;border-bottom:1px solid rgba(0,0,0,.1);margin-bottom:28px}.logo-accent{color:#1D9E75}.auth-card,.form-card,.output-card,.loading-card{background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.04)}#auth-screen{display:flex;justify-content:center;padding:60px 0}.auth-card{padding:36px;max-width:420px;width:100%;text-align:center}.google-btn,.demo-btn{width:100%;padding:11px;border-radius:8px;cursor:pointer;font-size:.9rem}.google-btn{border:1px solid rgba(0,0,0,.18);background:#fff}.demo-btn{margin-top:10px;border:1px solid #1D9E75;background:#E1F5EE;color:#0F6E56}.auth-note{font-size:.75rem;color:#999;margin-top:14px}.form-card{padding:24px}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-family:'Courier New',monospace;font-size:.72rem;color:#999;text-transform:uppercase}select,input{padding:9px 12px;border:1px solid rgba(0,0,0,.18);border-radius:8px;background:#F7F6F3}.gen-btn{width:100%;margin-top:14px;padding:12px;border:none;border-radius:8px;background:#1D9E75;color:#fff}.output-toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid rgba(0,0,0,.1);background:#F1F0EB}.output-body{padding:22px;white-space:pre-wrap;font-family:'Courier New',monospace;max-height:480px;overflow:auto}.error-box{background:#FCEBEB;border:1px solid rgba(226,75,74,.2);padding:10px 14px;border-radius:8px;color:#A32D2D;margin:12px 0}#app-screen{display:none}</style>
</head><body>
<div class="app">
<header class="site-header"><div>Teach<span class="logo-accent">Kit</span> AI</div><div id="header-right"></div></header>
<div id="auth-screen"><div class="auth-card"><h2>Sign in</h2><p class="auth-note">Use Google to continue, or use local demo mode.</p><button class="google-btn" onclick="signInWithGoogle()">Continue with Google</button><button class="demo-btn" onclick="signInDemo()">Continue in Demo Mode</button><p class="auth-note">Free: 5 worksheets/month · Pro: ₹199/month unlimited</p></div></div>
<div id="app-screen"><div id="error-area"></div><div class="form-card"><div class="form-grid"><div class="field"><label>Board</label><select id="board"><option>CBSE</option><option>Tamil Nadu State Board</option></select></div><div class="field"><label>Grade</label><select id="grade"><option>Grade 6</option><option>Grade 7</option><option selected>Grade 10</option></select></div><div class="field"><label>Subject</label><select id="subject"><option>Science</option><option>Mathematics</option></select></div><div class="field full"><label>Chapter / Topic</label><input id="chapter" placeholder="e.g. Light"></div></div><button class="gen-btn" id="gen-btn" onclick="generate()">◆ Generate worksheet</button></div><div id="loading-area" style="display:none"><div class="loading-card" style="padding:18px">Generating your worksheet...</div></div><div id="output-area" style="display:none"><div class="output-card"><div class="output-toolbar"><span id="out-meta"></span><button onclick="copyOut()">Copy</button></div><div class="output-body" id="out-body"></div></div></div></div>
</div>
<script>
const FIREBASE_CONFIG={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT_ID",storageBucket:"YOUR_PROJECT.appspot.com",messagingSenderId:"YOUR_SENDER_ID",appId:"YOUR_APP_ID"};
const ANTHROPIC_API_KEY="YOUR_ANTHROPIC_API_KEY"; const API_URL="https://api.anthropic.com/v1/messages"; let lastWorksheet=""; let demoMode=false; let auth,db,currentUser=null;
try{firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(u=>u?(currentUser=u,showApp(u)):showAuth())}catch(e){console.warn('Firebase init failed, demo only',e);showAuth();}
function signInWithGoogle(){if(!auth){showError('Firebase is not configured. Use Demo Mode.');return;}auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>showError(e.message));}
function signInDemo(){demoMode=true;currentUser={displayName:'Demo Teacher',email:'demo@example.com'};showApp(currentUser);}
function showAuth(){document.getElementById('auth-screen').style.display='flex';document.getElementById('app-screen').style.display='none';document.getElementById('header-right').innerHTML='';}
function showApp(user){document.getElementById('auth-screen').style.display='none';document.getElementById('app-screen').style.display='block';document.getElementById('header-right').innerHTML='<button onclick="signOut()">Sign out</button>';}
function signOut(){if(!demoMode&&auth){auth.signOut();} demoMode=false; currentUser=null; showAuth();}
async function generate(){clearError();const board=boardEl('board'),grade=boardEl('grade'),subject=boardEl('subject'),chapter=boardEl('chapter').trim(); if(!chapter){showError('Please enter a chapter or topic name.');return;} setLoading(true); try{ if(demoMode){lastWorksheet=`${board} | ${grade} | ${subject}
Topic: ${chapter}

1) Define the topic in your own words.
2) Give one real-world example.
3) Write 5 MCQs with answers.`;} else {const resp=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':ANTHROPIC_API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:`Generate a worksheet for ${board} ${grade} ${subject} topic ${chapter}.`}]})}); const data=await resp.json(); if(data.error) throw new Error(data.error.message); lastWorksheet=(data.content||[]).map(b=>b.text||'').join(''); }
 document.getElementById('out-meta').textContent=`${board} · ${grade} · ${subject} · ${chapter}`; document.getElementById('out-body').textContent=lastWorksheet; document.getElementById('output-area').style.display='block'; } catch(e){showError('Generation failed: '+e.message);} finally{setLoading(false);} }
function boardEl(id){return document.getElementById(id).value;} function copyOut(){navigator.clipboard.writeText(lastWorksheet||'');}
function setLoading(on){document.getElementById('loading-area').style.display=on?'block':'none';document.getElementById('gen-btn').disabled=on;}
function showError(msg){document.getElementById('error-area').innerHTML=`<div class="error-box">⚠ ${msg}</div>`;} function clearError(){document.getElementById('error-area').innerHTML='';}
</script></body></html>
