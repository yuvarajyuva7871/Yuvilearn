<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeachKit AI — Worksheet Generator for Indian Teachers</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* ─── RESET & BASE ───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --teal:      #1D9E75;
  --teal-dark: #0F6E56;
  --teal-bg:   #E1F5EE;
  --purple:    #534AB7;
  --purple-bg: #EEEDFE;
  --purple-txt:#3C3489;
  --amber-bg:  #FAEEDA;
  --amber-txt: #854F0B;
  --red:       #E24B4A;
  --red-bg:    #FCEBEB;
  --red-txt:   #A32D2D;
  --text-1:    #1a1a1a;
  --text-2:    #555;
  --text-3:    #999;
  --border:    rgba(0,0,0,0.10);
  --border-md: rgba(0,0,0,0.18);
  --bg-page:   #F7F6F3;
  --bg-card:   #ffffff;
  --bg-surface:#F1F0EB;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow:    0 1px 3px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.04);
}

html { font-size: 16px; }
body {
  font-family: 'Georgia', serif;
  background: var(--bg-page);
  color: var(--text-1);
  min-height: 100vh;
  line-height: 1.6;
}

/* ─── TYPOGRAPHY ─────────────────────────────────────────────── */
h1 { font-size: 1.5rem; font-weight: normal; letter-spacing: -0.02em; }
h2 { font-size: 1.1rem; font-weight: normal; }
label, .label { font-family: 'Courier New', monospace; font-size: 0.72rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; }

/* ─── LAYOUT ─────────────────────────────────────────────────── */
.app { max-width: 780px; margin: 0 auto; padding: 0 16px 60px; }

/* ─── HEADER ─────────────────────────────────────────────────── */
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 0 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 28px;
}
.logo {
  display: flex;
  align-items: baseline;
  gap: 2px;
  font-size: 1.25rem;
  font-family: 'Georgia', serif;
  letter-spacing: -0.03em;
  color: var(--text-1);
}
.logo-accent { color: var(--teal); }
.logo-tag {
  font-family: 'Courier New', monospace;
  font-size: 0.65rem;
  color: var(--text-3);
  margin-left: 8px;
  letter-spacing: 0.05em;
  border: 1px solid var(--border);
  padding: 2px 7px;
  border-radius: 20px;
  vertical-align: middle;
}

/* ─── USER BAR ───────────────────────────────────────────────── */
.user-bar {
  display: flex;
  align-items: center;
  gap: 10px;
}
.user-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--teal-bg);
  color: var(--teal-dark);
  font-size: 0.8rem;
  font-family: 'Courier New', monospace;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold;
  border: 1px solid rgba(29,158,117,0.2);
}
.user-name { font-size: 0.85rem; color: var(--text-2); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ─── USAGE STRIP ────────────────────────────────────────────── */
.usage-strip {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  margin-bottom: 24px;
}
.usage-plan {
  font-family: 'Courier New', monospace;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 3px 9px;
  border-radius: 20px;
  background: var(--bg-surface);
  color: var(--text-2);
  white-space: nowrap;
}
.usage-plan.pro { background: var(--teal-bg); color: var(--teal-dark); }
.usage-text { font-size: 0.82rem; color: var(--text-2); flex: 1; }
.usage-bar-wrap { width: 100px; height: 4px; background: var(--bg-surface); border-radius: 4px; overflow: hidden; }
.usage-bar { height: 4px; background: var(--teal); border-radius: 4px; transition: width .4s, background .4s; }
.upgrade-btn {
  font-family: 'Courier New', monospace;
  font-size: 0.72rem;
  padding: 6px 14px;
  border-radius: 20px;
  background: var(--purple);
  color: #fff;
  border: none;
  cursor: pointer;
  white-space: nowrap;
  transition: background .2s;
}
.upgrade-btn:hover { background: var(--purple-txt); }
.upgrade-btn.active { background: var(--teal); }

/* ─── SIGN-IN SCREEN ─────────────────────────────────────────── */
#auth-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 0;
  text-align: center;
}
.auth-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 40px 36px;
  max-width: 380px;
  width: 100%;
  box-shadow: var(--shadow);
}
.auth-logo { font-size: 2rem; letter-spacing: -0.04em; margin-bottom: 8px; }
.auth-logo .logo-accent { color: var(--teal); }
.auth-tagline { font-size: 0.88rem; color: var(--text-2); margin-bottom: 28px; line-height: 1.6; }
.google-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 11px;
  border: 1px solid var(--border-md);
  border-radius: var(--radius-sm);
  background: #fff;
  font-size: 0.9rem;
  color: var(--text-1);
  cursor: pointer;
  transition: background .15s, border-color .15s;
  font-family: 'Georgia', serif;
}
.google-btn:hover { background: var(--bg-surface); border-color: var(--border-md); }
.google-icon { width: 18px; height: 18px; flex-shrink: 0; }
.auth-note { font-size: 0.75rem; color: var(--text-3); margin-top: 16px; }

/* ─── MAIN APP ───────────────────────────────────────────────── */
#app-screen { display: none; }

/* ─── FORM CARD ──────────────────────────────────────────────── */
.form-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 14px;
  margin-bottom: 14px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field.full { grid-column: 1 / -1; }

select, input[type="text"] {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border-md);
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  color: var(--text-1);
  background: var(--bg-page);
  font-family: 'Georgia', serif;
  appearance: none;
  -webkit-appearance: none;
  outline: none;
  transition: border-color .15s;
}
select:focus, input[type="text"]:focus {
  border-color: var(--teal);
  background: #fff;
}
input[type="text"]::placeholder { color: var(--text-3); }

/* ─── GENERATE BUTTON ────────────────────────────────────────── */
.gen-btn {
  width: 100%;
  padding: 12px;
  background: var(--teal);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.95rem;
  font-family: 'Georgia', serif;
  cursor: pointer;
  transition: background .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.gen-btn:hover { background: var(--teal-dark); }
.gen-btn:disabled { background: #aaa; cursor: not-allowed; }

/* ─── OUTPUT CARD ────────────────────────────────────────────── */
.output-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.output-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-surface);
  gap: 10px;
  flex-wrap: wrap;
}
.output-meta {
  font-family: 'Courier New', monospace;
  font-size: 0.78rem;
  color: var(--text-2);
  letter-spacing: 0.01em;
}
.tool-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.tool-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 14px;
  border: 1px solid var(--border-md);
  border-radius: 20px;
  font-size: 0.78rem;
  background: var(--bg-card);
  color: var(--text-2);
  cursor: pointer;
  font-family: 'Courier New', monospace;
  transition: all .15s;
  white-space: nowrap;
}
.tool-btn:hover { background: var(--bg-surface); color: var(--text-1); }
.tool-btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.tool-btn.primary:hover { background: var(--teal-dark); }

.output-body {
  padding: 22px;
  font-family: 'Courier New', monospace;
  font-size: 0.82rem;
  color: var(--text-1);
  line-height: 1.9;
  white-space: pre-wrap;
  max-height: 480px;
  overflow-y: auto;
}

/* ─── LOADING ─────────────────────────────────────────────────── */
.loading-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px 22px;
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.loading-dots { display: flex; gap: 5px; }
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--teal);
  animation: bounce 1.2s infinite;
}
.dot:nth-child(2) { animation-delay: .2s; }
.dot:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,100%{opacity:.2;transform:scale(.8);}50%{opacity:1;transform:scale(1);} }
.loading-text { font-size: 0.88rem; color: var(--text-2); font-family: 'Courier New', monospace; }

/* ─── UPGRADE GATE ───────────────────────────────────────────── */
.gate-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 36px 28px;
  text-align: center;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.gate-icon { font-size: 2rem; margin-bottom: 12px; color: var(--text-3); }
.gate-title { font-size: 1.1rem; margin-bottom: 8px; }
.gate-sub { font-size: 0.85rem; color: var(--text-2); margin-bottom: 20px; line-height: 1.7; max-width: 400px; margin-left: auto; margin-right: auto; }
.gate-upgrade-btn {
  padding: 10px 28px;
  background: var(--purple);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  cursor: pointer;
  font-family: 'Georgia', serif;
  transition: background .2s;
  display: inline-block;
  margin-bottom: 10px;
}
.gate-upgrade-btn:hover { background: var(--purple-txt); }
.gate-note { font-size: 0.75rem; color: var(--text-3); font-family: 'Courier New', monospace; }

/* ─── HISTORY ─────────────────────────────────────────────────── */
.history-section { margin-top: 8px; }
.section-label {
  font-family: 'Courier New', monospace;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-3);
  margin-bottom: 10px;
}
.hist-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  font-size: 0.82rem;
}
.hist-name { color: var(--text-2); font-family: 'Courier New', monospace; }
.hist-actions { display: flex; gap: 10px; }
.hist-link { color: var(--teal); cursor: pointer; font-family: 'Courier New', monospace; font-size: 0.75rem; }
.hist-link:hover { color: var(--teal-dark); text-decoration: underline; }

/* ─── WATERMARK NOTE ──────────────────────────────────────────── */
.wm-note {
  font-family: 'Courier New', monospace;
  font-size: 0.72rem;
  color: var(--text-3);
  text-align: center;
  padding: 6px;
}

/* ─── ERROR ───────────────────────────────────────────────────── */
.error-box {
  background: var(--red-bg);
  border: 1px solid rgba(226,75,74,0.2);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 0.82rem;
  color: var(--red-txt);
  margin-bottom: 12px;
  font-family: 'Courier New', monospace;
}

/* ─── SIGN OUT ────────────────────────────────────────────────── */
.signout-btn {
  font-family: 'Courier New', monospace;
  font-size: 0.72rem;
  color: var(--text-3);
  background: none;
  border: 1px solid var(--border);
  padding: 5px 12px;
  border-radius: 20px;
  cursor: pointer;
  transition: color .15s, border-color .15s;
}
.signout-btn:hover { color: var(--text-1); border-color: var(--border-md); }

/* ─── SCROLLBAR ───────────────────────────────────────────────── */
.output-body::-webkit-scrollbar { width: 5px; }
.output-body::-webkit-scrollbar-track { background: transparent; }
.output-body::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 3px; }

@media (max-width: 480px) {
  .form-grid { grid-template-columns: 1fr; }
  .site-header { flex-wrap: wrap; gap: 10px; }
  .user-name { display: none; }
  .usage-strip { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div class="app">

  <!-- SITE HEADER -->
  <header class="site-header">
    <div class="logo">
      Teach<span class="logo-accent">Kit</span> AI
      <span class="logo-tag">Beta</span>
    </div>
    <div id="header-right"></div>
  </header>

  <!-- AUTH SCREEN -->
  <div id="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">Teach<span class="logo-accent">Kit</span> AI</div>
      <p class="auth-tagline">Generate CBSE &amp; Tamil Nadu State Board worksheets, test papers, and lesson plans — in Tamil or English — in seconds.</p>
      <button class="google-btn" onclick="signInWithGoogle()">
        <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>
      <p class="auth-note">Free: 5 worksheets/month &nbsp;·&nbsp; Pro: ₹199/month unlimited</p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app-screen">

    <!-- USAGE STRIP -->
    <div class="usage-strip" id="usage-strip">
      <span class="usage-plan" id="plan-badge">Free</span>
      <div class="usage-bar-wrap">
        <div class="usage-bar" id="usage-bar" style="width:0%"></div>
      </div>
      <span class="usage-text" id="usage-text">0 of 5 free worksheets used this month</span>
      <button class="upgrade-btn" id="upgrade-btn" onclick="handleUpgrade()">Upgrade Pro ₹199</button>
    </div>

    <!-- ERROR -->
    <div id="error-area"></div>

    <!-- FORM -->
    <div class="form-card">
      <div class="form-grid">
        <div class="field">
          <label>Board</label>
          <select id="board">
            <option value="CBSE">CBSE</option>
            <option value="Tamil Nadu State Board">Tamil Nadu State Board</option>
          </select>
        </div>
        <div class="field">
          <label>Grade</label>
          <select id="grade">
            <option>Grade 6</option><option>Grade 7</option><option>Grade 8</option>
            <option>Grade 9</option><option selected>Grade 10</option>
            <option>Grade 11</option><option>Grade 12</option>
          </select>
        </div>
        <div class="field">
          <label>Subject</label>
          <select id="subject">
            <option>Science</option><option>Physics</option><option>Chemistry</option>
            <option>Biology</option><option>Mathematics</option><option>Social Science</option>
          </select>
        </div>
        <div class="field">
          <label>Chapter / Topic</label>
          <input type="text" id="chapter" placeholder="e.g. Light, Acids and Bases, Gravitation" value="">
        </div>
        <div class="field">
          <label>Language</label>
          <select id="lang">
            <option value="English">English medium</option>
            <option value="Tamil">Tamil medium</option>
            <option value="Bilingual">Bilingual (Tamil + English)</option>
          </select>
        </div>
        <div class="field">
          <label>Difficulty</label>
          <select id="diff">
            <option>Easy</option><option selected>Medium</option><option>Hard</option><option>Mixed</option>
          </select>
        </div>
        <div class="field full">
          <label>Worksheet type</label>
          <select id="wtype">
            <option value="full">Full worksheet — MCQ + Short + Long answer</option>
            <option value="mcq">MCQ only (20 questions)</option>
            <option value="short">Short answer only (10 questions)</option>
            <option value="hots">HOTS / Higher-order thinking questions</option>
            <option value="fill">Fill in the blanks + True / False</option>
          </select>
        </div>
      </div>
      <button class="gen-btn" id="gen-btn" onclick="generate()">
        &#9670; Generate worksheet
      </button>
    </div>

    <!-- GATE (shown when limit hit) -->
    <div id="gate-area"></div>

    <!-- LOADING -->
    <div id="loading-area" style="display:none;">
      <div class="loading-card">
        <div class="loading-dots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <span class="loading-text" id="loading-msg">Generating your worksheet...</span>
      </div>
    </div>

    <!-- OUTPUT -->
    <div id="output-area" style="display:none;">
      <div class="output-card">
        <div class="output-toolbar">
          <span class="output-meta" id="out-meta"></span>
          <div class="tool-btns">
            <button class="tool-btn" onclick="copyOut()">&#10697; Copy text</button>
            <button class="tool-btn primary" onclick="exportPDF()" id="pdf-btn">&#8659; Download PDF</button>
          </div>
        </div>
        <div class="output-body" id="out-body"></div>
      </div>
      <div class="wm-note" id="wm-note"></div>
    </div>

    <!-- HISTORY -->
    <div id="history-area" style="display:none;" class="history-section">
      <div class="section-label">This session</div>
      <div id="history-list"></div>
    </div>

  </div><!-- /app-screen -->
</div><!-- /app -->

<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIGURATION — Replace these values with your own
   ═══════════════════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_PROJECT.firebaseapp.com",
  projectId:         "YOUR_PROJECT_ID",
  storageBucket:     "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId:             "YOUR_APP_ID"
};

// Put your Anthropic API key in a Firebase Function (see README below).
// For local testing only, you can set it here — REMOVE before deploying.
const ANTHROPIC_API_KEY = "YOUR_ANTHROPIC_API_KEY";

// In production, replace the fetch URL below with your Firebase Function URL:
// const API_URL = "https://us-central1-YOUR_PROJECT.cloudfunctions.net/generateWorksheet";
const API_URL = "https://api.anthropic.com/v1/messages"; // direct (dev only)

const FREE_LIMIT = 5;

/* ═══════════════════════════════════════════════════════════════
   FIREBASE INIT
   ═══════════════════════════════════════════════════════════════ */
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db   = firebase.firestore();

/* ═══════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════ */
let currentUser  = null;
let userPlan     = "free";   // "free" | "pro"
let usageCount   = 0;
let lastWorksheet = "";
let lastMeta      = "";
let sessionHistory = [];

/* ═══════════════════════════════════════════════════════════════
   AUTH
   ═══════════════════════════════════════════════════════════════ */
auth.onAuthStateChanged(async user => {
  if (user) {
    currentUser = user;
    showApp(user);
    await loadUserData(user.uid);
  } else {
    currentUser = null;
    showAuth();
  }
});

function signInWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e => showError(e.message));
}

function signOut() {
  auth.signOut();
}

function showAuth() {
  document.getElementById("auth-screen").style.display = "flex";
  document.getElementById("app-screen").style.display  = "none";
  document.getElementById("header-right").innerHTML = "";
}

function showApp(user) {
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("app-screen").style.display  = "block";

  const initials = (user.displayName || user.email || "U")
    .split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 2);

  document.getElementById("header-right").innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="user-avatar">${initials}</div>
      <span class="user-name">${user.displayName || user.email}</span>
      <button class="signout-btn" onclick="signOut()">Sign out</button>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════
   FIRESTORE — USAGE TRACKING
   ═══════════════════════════════════════════════════════════════ */
async function loadUserData(uid) {
  try {
    const userDoc = await db.collection("users").doc(uid).get();
    if (userDoc.exists) {
      const data = userDoc.data();
      userPlan = data.plan || "free";
    }

    const monthKey = getMonthKey();
    const usageDoc = await db.collection("users").doc(uid)
      .collection("usage").doc(monthKey).get();

    usageCount = usageDoc.exists ? (usageDoc.data().count || 0) : 0;
    updateUsageUI();
  } catch(e) {
    // Firestore not configured yet — run in demo mode
    console.warn("Firestore not configured. Running in demo mode.", e.message);
    updateUsageUI();
  }
}

async function incrementUsage() {
  if (!currentUser) return;
  usageCount++;
  updateUsageUI();
  try {
    const monthKey = getMonthKey();
    await db.collection("users").doc(currentUser.uid)
      .collection("usage").doc(monthKey)
      .set({ count: usageCount, updatedAt: firebase.firestore.FieldValue.serverTimestamp() },
           { merge: true });
  } catch(e) {
    console.warn("Could not write usage to Firestore:", e.message);
  }
}

function getMonthKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

/* ═══════════════════════════════════════════════════════════════
   USAGE UI
   ═══════════════════════════════════════════════════════════════ */
function updateUsageUI() {
  const isPro = userPlan === "pro";
  const pct   = isPro ? 0 : Math.min(100, Math.round((usageCount / FREE_LIMIT) * 100));

  document.getElementById("plan-badge").textContent = isPro ? "Pro" : "Free";
  document.getElementById("plan-badge").className   = "usage-plan" + (isPro ? " pro" : "");
  document.getElementById("usage-bar").style.width  = pct + "%";
  document.getElementById("usage-bar").style.background =
    pct >= 100 ? "#E24B4A" : pct >= 80 ? "#EF9F27" : "#1D9E75";
  document.getElementById("usage-text").textContent = isPro
    ? "Pro plan — unlimited worksheets"
    : `${usageCount} of ${FREE_LIMIT} free worksheets used this month`;

  const upgradeBtn = document.getElementById("upgrade-btn");
  if (isPro) {
    upgradeBtn.textContent = "Pro active ✓";
    upgradeBtn.className   = "upgrade-btn active";
  }
}

/* ═══════════════════════════════════════════════════════════════
   PROMPT BUILDER
   ═══════════════════════════════════════════════════════════════ */
function buildSystemPrompt(board, grade, subject, chapter, lang, diff, wtype) {
  const typeMap = {
    full: `Generate a complete worksheet:
- Section A: 10 MCQs (1 mark each), 4 options (a–d), mark correct as [Answer: x]
- Section B: 5 Short Answer questions (2 marks each)
- Section C: 2 Long Answer questions (5 marks each)
Total: 30 marks. Header must include "Total Marks: 30" and "Time: 1 hour".`,
    mcq: `Generate exactly 20 MCQs (1 mark each).
Each has 4 options (a–d). Mark the correct answer as [Answer: x].
Total: 20 marks. Header must include "Total Marks: 20" and "Time: 40 minutes".`,
    short: `Generate exactly 10 Short Answer questions (2 marks each).
Vary between define, explain, compare, and give-example types.
Total: 20 marks. Header must include "Total Marks: 20" and "Time: 40 minutes".`,
    hots: `Generate 8 Higher-Order Thinking (HOTS) questions (3 marks each).
These must require analysis, evaluation, or real-world application — no pure recall.
Include at least 2 scenario-based questions.
Total: 24 marks. Header must include "Total Marks: 24" and "Time: 45 minutes".`,
    fill: `Generate 10 Fill in the Blanks (1 mark each) and 10 True/False statements (1 mark each).
For True/False: put [True] or [False] at the end of each statement.
Total: 20 marks. Header must include "Total Marks: 20" and "Time: 30 minutes".`
  };

  const langMap = {
    English:   `Write entirely in English. Use clear, age-appropriate language for ${grade} students.`,
    Tamil:     `Write entirely in Tamil script. Use standard Tamil Nadu school examination terminology throughout.`,
    Bilingual: `Write each question in Tamil first, then its English translation in brackets below.\nFormat for each question:\nதமிழ் கேள்வி ...\n(English: ...)`
  };

  const diffMap = {
    Easy:   "Use direct recall and basic comprehension only. No application.",
    Medium: "Balance recall (50%) with application and understanding (50%).",
    Hard:   "Focus on application, analysis, and evaluation. Minimal recall.",
    Mixed:  "Include easy (30%), medium (40%), and hard (30%) questions across sections."
  };

  return `You are TeachKit AI, an expert Indian school worksheet generator built for the ${board} curriculum.

TASK: Generate a high-quality, print-ready worksheet.

DETAILS:
Board: ${board}
Grade: ${grade}
Subject: ${subject}
Chapter / Topic: ${chapter}

LANGUAGE RULE:
${langMap[lang]}

DIFFICULTY: ${diffMap[diff]}

WORKSHEET FORMAT:
${typeMap[wtype]}

HEADER FORMAT (use exactly this structure at the top):
${board} | ${grade} | ${subject}
Topic: ${chapter}
Language: ${lang} | Difficulty: ${diff}
[Total Marks line] | [Time line]
_______________________________

RULES:
1. All questions must come strictly from the ${board} ${grade} ${subject} syllabus for the topic: "${chapter}". Do not include questions from other chapters.
2. MCQ options must be clearly wrong/right — no ambiguous distractors.
3. Number all questions. Use Section A / B / C headings where the format calls for them.
4. End with an "Answer Key" section listing only MCQ answers (e.g. 1-b, 2-a, 3-d …).
5. Output ONLY the worksheet. No preamble, no meta-commentary, no closing remarks.`;
}

/* ═══════════════════════════════════════════════════════════════
   GENERATE
   ═══════════════════════════════════════════════════════════════ */
async function generate() {
  clearError();
  document.getElementById("gate-area").innerHTML = "";

  const board   = document.getElementById("board").value;
  const grade   = document.getElementById("grade").value;
  const subject = document.getElementById("subject").value;
  const chapter = document.getElementById("chapter").value.trim();
  const lang    = document.getElementById("lang").value;
  const diff    = document.getElementById("diff").value;
  const wtype   = document.getElementById("wtype").value;

  if (!chapter) { showError("Please enter a chapter or topic name."); return; }

  // Usage gate
  if (userPlan !== "pro" && usageCount >= FREE_LIMIT) {
    document.getElementById("gate-area").innerHTML = `
      <div class="gate-card">
        <div class="gate-icon">&#128274;</div>
        <h2 class="gate-title">You've used all ${FREE_LIMIT} free worksheets this month</h2>
        <p class="gate-sub">Upgrade to Pro for unlimited worksheets, clean PDF exports without watermarks, Tamil medium support, and Word export (coming soon).</p>
        <button class="gate-upgrade-btn" onclick="handleUpgrade()">Upgrade to Pro — ₹199 / month</button>
        <p class="gate-note">Resets on the 1st of each month &nbsp;·&nbsp; Cancel anytime</p>
      </div>`;
    return;
  }

  setLoading(true, "Generating your worksheet...");

  try {
    const systemPrompt = buildSystemPrompt(board, grade, subject, chapter, lang, diff, wtype);
    const userMessage  = `Generate the worksheet now for: ${board} ${grade} ${subject} — Topic: "${chapter}". Language: ${lang}. Type: ${wtype}. Difficulty: ${diff}.`;

    // ── Direct API call (development) ──────────────────────────
    // In production: replace this block with a fetch to your Firebase Function
    // which holds the API key server-side.
    const resp = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": ANTHROPIC_API_KEY,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: "user", content: userMessage }]
      })
    });

    const data = await resp.json();
    if (data.error) throw new Error(data.error.message);

    let text = data.content.map(b => b.text || "").join("");

    // Watermark for free users
    const isProUser = userPlan === "pro";
    if (!isProUser) {
      text += "\n\n_______________________________\nGenerated by TeachKit AI (Free Plan)\nUnlimited worksheets + no watermark: teachkitai.com/pro\n_______________________________";
      document.getElementById("wm-note").textContent =
        "Free plan: watermark added to PDF. Upgrade to Pro to remove.";
    } else {
      document.getElementById("wm-note").textContent = "";
    }

    lastWorksheet = text;
    lastMeta = `${board} · ${grade} · ${subject} · ${chapter}`;

    document.getElementById("out-body").textContent = text;
    document.getElementById("out-meta").textContent = lastMeta;
    document.getElementById("output-area").style.display = "block";

    // Increment usage in Firestore
    if (!isProUser) await incrementUsage();

    // Add to session history
    sessionHistory.unshift({ meta: lastMeta, board, grade, subject, chapter, lang, diff, wtype });
    if (sessionHistory.length > 4) sessionHistory.pop();
    renderHistory();

  } catch(e) {
    showError("Generation failed: " + e.message);
  } finally {
    setLoading(false);
  }
}

/* ═══════════════════════════════════════════════════════════════
   PDF EXPORT (jsPDF)
   ═══════════════════════════════════════════════════════════════ */
function exportPDF() {
  if (!lastWorksheet) return;

  const btn = document.getElementById("pdf-btn");
  btn.textContent = "Building PDF...";
  btn.disabled = true;

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });

    const ML  = 15;         // margin left
    const MR  = 15;         // margin right
    const MT  = 14;         // margin top
    const PW  = 210;        // page width
    const PH  = 297;        // page height
    const UW  = PW - ML - MR; // usable width
    const LH  = 6.2;        // line height mm
    let   y   = MT;

    // ── Header bar ────────────────────────────────────────────
    doc.setFillColor(225, 245, 238);          // teal-bg
    doc.rect(0, 0, PW, 12, "F");
    doc.setFontSize(8);
    doc.setFont("courier", "normal");
    doc.setTextColor(15, 110, 86);
    doc.text("TeachKit AI" + (userPlan === "pro" ? " Pro" : ""), ML, 8);
    doc.setTextColor(120, 120, 120);
    doc.text(new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }), PW - MR, 8, { align: "right" });
    y = 20;

    // ── Body content ──────────────────────────────────────────
    const lines = lastWorksheet.split("\n");
    let firstLine = true;

    for (const rawLine of lines) {
      const line = rawLine.trimEnd();

      if (y > PH - MT) {
        doc.addPage();
        y = MT + 4;
      }

      if (firstLine && line.trim()) {
        // Title line
        doc.setFontSize(12);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(15, 110, 86);
        firstLine = false;
      } else if (/^(Section [A-Z]|SECTION [A-Z]|Answer Key|ANSWER KEY)/i.test(line.trim())) {
        // Section headings
        doc.setFontSize(10);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(30, 30, 30);
      } else if (line.startsWith("___") || line.trim() === "") {
        // Dividers and blank lines
        if (line.startsWith("___")) {
          doc.setDrawColor(200, 200, 200);
          doc.setLineWidth(0.3);
          doc.line(ML, y - 1, PW - MR, y - 1);
        }
        doc.setFontSize(9);
        doc.setFont("courier", "normal");
        doc.setTextColor(160, 160, 160);
      } else if (/^\d+[\.\)]/.test(line.trim()) || /^[a-d][\.\)]/.test(line.trim())) {
        // Question and option lines
        doc.setFontSize(9.5);
        doc.setFont("courier", "normal");
        doc.setTextColor(35, 35, 35);
      } else {
        // Default body
        doc.setFontSize(9);
        doc.setFont("courier", "normal");
        doc.setTextColor(60, 60, 60);
      }

      const wrapped = doc.splitTextToSize(line || " ", UW);
      doc.text(wrapped, ML, y);
      y += wrapped.length * LH + (line.trim() === "" ? 1 : 0);
    }

    // ── Footer on last page ───────────────────────────────────
    doc.setFontSize(7);
    doc.setFont("courier", "normal");
    doc.setTextColor(180, 180, 180);
    doc.text("teachkitai.com", PW / 2, PH - 8, { align: "center" });

    const filename = "teachkit_" + lastMeta.replace(/[^a-z0-9]/gi, "_").toLowerCase().slice(0, 40) + ".pdf";
    doc.save(filename);

  } catch(e) {
    showError("PDF export failed: " + e.message);
  } finally {
    btn.innerHTML = "&#8659; Download PDF";
    btn.disabled = false;
  }
}

/* ═══════════════════════════════════════════════════════════════
   COPY
   ═══════════════════════════════════════════════════════════════ */
function copyOut() {
  navigator.clipboard.writeText(lastWorksheet).then(() => {
    const btn = document.querySelectorAll(".tool-btn")[0];
    btn.textContent = "✓ Copied!";
    setTimeout(() => { btn.textContent = "⌗ Copy text"; }, 1800);
  });
}

/* ═══════════════════════════════════════════════════════════════
   HISTORY
   ═══════════════════════════════════════════════════════════════ */
function renderHistory() {
  if (!sessionHistory.length) return;
  document.getElementById("history-area").style.display = "block";
  document.getElementById("history-list").innerHTML = sessionHistory.map((h, i) => `
    <div class="hist-item">
      <span class="hist-name">${h.meta}</span>
      <div class="hist-actions">
        <span class="hist-link" onclick="reuseHistory(${i})">Regenerate</span>
      </div>
    </div>`).join("");
}

function reuseHistory(i) {
  const h = sessionHistory[i];
  document.getElementById("board").value   = h.board;
  document.getElementById("grade").value   = h.grade;
  document.getElementById("subject").value = h.subject;
  document.getElementById("chapter").value = h.chapter;
  document.getElementById("lang").value    = h.lang;
  document.getElementById("diff").value    = h.diff;
  document.getElementById("wtype").value   = h.wtype;
  generate();
}

/* ═══════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════ */
function setLoading(on, msg = "") {
  document.getElementById("loading-area").style.display = on ? "block" : "none";
  document.getElementById("output-area").style.display  = on ? "none" : (lastWorksheet ? "block" : "none");
  document.getElementById("loading-msg").textContent    = msg;
  document.getElementById("gen-btn").disabled           = on;
  document.getElementById("gen-btn").textContent        = on ? "Generating..." : "◆ Generate worksheet";
}

function showError(msg) {
  document.getElementById("error-area").innerHTML =
    `<div class="error-box">&#9888; ${msg}</div>`;
}

function clearError() {
  document.getElementById("error-area").innerHTML = "";
}
