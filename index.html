<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basic Login Website</title>
  <style>
    :root { font-family: Inter, Arial, sans-serif; }
    body { margin: 0; background:#f4f6fb; color:#1f2937; }
    .container { min-height:100vh; display:grid; place-items:center; padding: 1.5rem; }
    .card { width:100%; max-width:380px; background:white; border-radius:16px; padding:1.5rem; box-shadow:0 14px 35px rgba(0,0,0,.08); }
    h1 { margin:.2rem 0 1rem; font-size:1.4rem; }
    .muted { color:#6b7280; margin:0 0 1rem; font-size:.95rem; }
    label { display:block; margin:.7rem 0 .3rem; font-size:.9rem; }
    input { width:100%; padding:.75rem .85rem; border:1px solid #d1d5db; border-radius:10px; font-size:.95rem; box-sizing:border-box; }
    input:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.15); }
    button { width:100%; margin-top:1rem; padding:.75rem; border:0; border-radius:10px; font-weight:600; background:#2563eb; color:white; cursor:pointer; }
    button:hover { background:#1d4ed8; }
    .error { color:#b91c1c; margin-top:.75rem; min-height:1.2rem; }
    .welcome { text-align:center; }
    .welcome h2 { margin-top:0; }
    .logout { background:#374151; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <main class="container">
    <section class="card" id="login-card">
      <h1>Sign in</h1>
      <p class="muted">Use demo credentials: <b>demo@example.com</b> / <b>password123</b></p>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />

        <button type="submit">Login</button>
        <p class="error" id="error"></p>
      </form>
    </section>

    <section class="card hidden welcome" id="welcome-card">
      <h2>Welcome!</h2>
      <p id="welcome-text"></p>
      <button class="logout" id="logout">Logout</button>
    </section>
  </main>

  <script>
    const DEMO_USER = { email: 'demo@example.com', password: 'password123' };
    const loginCard = document.getElementById('login-card');
    const welcomeCard = document.getElementById('welcome-card');
    const loginForm = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const welcomeText = document.getElementById('welcome-text');
    const logoutBtn = document.getElementById('logout');

    function render() {
      const user = localStorage.getItem('loggedInUser');
      if (user) {
        welcomeText.textContent = `You are logged in as ${user}.`;
        loginCard.classList.add('hidden');
        welcomeCard.classList.remove('hidden');
      } else {
        loginCard.classList.remove('hidden');
        welcomeCard.classList.add('hidden');
      }
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      if (email === DEMO_USER.email && password === DEMO_USER.password) {
        localStorage.setItem('loggedInUser', email);
        errorEl.textContent = '';
        loginForm.reset();
        render();
      } else {
        errorEl.textContent = 'Invalid email or password.';
      }
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('loggedInUser');
      render();
    });

    render();
  </script>
</body>
</html>
